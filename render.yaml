services:
  - type: web
    name: arbiter
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ARBITER_KEY_TENANT_A
        sync: false
      - key: ARBITER_KEY_TENANT_B
        sync: false
      - key: ARBITER_KEY_TENANT_TEST
        sync: false
      - key: REDIS_URL
        sync: false
      - key: LOGTAIL_SOURCE_TOKEN
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
